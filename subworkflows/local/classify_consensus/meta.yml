# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "classify_consensus"
description: BLAST sequences against a reference database and filter hits for reference genome selection
keywords:
  - blast
  - reference selection
  - filtering
  - alignment
  - sequence similarity
components:
  - blast/blastn
  - blastnfilter
input:
  - ch_consensus:
      description: |
        Consensus sequences for clusters of reads
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.fasta"
  - ch_blast_refdb:
      description: |
        BLAST database for sequence comparison
        Structure: [ val(meta), path(fasta) ]
  - ch_read_counts:
      description: |
        Channel containing read counts
        Structure: [ val(meta), val(count_raw), val(count_filtered) ]

output:
  - no_blast_hits:
      description: |
        Channel containing sample with no blast hits
        Structure: [ val(meta), mqc ]
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@snunzi"
maintainers:
  - "@snunzi"

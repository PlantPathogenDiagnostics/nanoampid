# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "longread_preprocessing"
description: Quality control and preprocessing of long-read sequencing data
keywords:
  - preprocessing
  - quality control
  - long reads
  - nanopore
  - trimming
components:
  - nanoq
  - porechop/porechop
  - porechop/abi
  - chopper
  - vsearch/orient
  - seqkit/rmdup
  - vsearch/orient
  - bbmap/reformat
input:
  - ch_samplesheet:
      type: file
      description: |
        Input fastq files for processing
        Structure: [ val(meta), path(fastq) ]
      pattern: "*.{fastq.gz}"
  - ch_reference:
      type: file
      description: | 
        Sequence database for read orientation

output:
  - long_reads:
      description: |
        Quality-controlled and preprocessed long reads
        Structure: [ val(meta), path(fastq) ]
      pattern: "*.fastq.gz"
  - read_counts:
      description: |
        Channel containing read counts
        Structure: [ val(meta), val(count_raw), val(count_filtered) ]
  - multiqc_files:
      type: file
      description: |
        multiqc files for statistics
        Structure: [ val(meta), path(*) ]
      pattern: "*"
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@snunzi"
maintainers:
  - "@snunzi"

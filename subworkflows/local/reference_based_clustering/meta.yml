# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "reference_based_clustering"
description: Cluster reads and make consensus sequences
keywords:
  - cluster
  - kmer
  - reference-based
  - consensus
components:
  - bbmap/seal
  - isonclust
  - filtlong
  - spoa
  - minimap2
  - racon
  - medaka
  - vsearch/cluster
input:
  - ch_samplesheet:
      type: file
      description: |
        Input fastq files for processing
        Structure: [ val(meta), path(fastq) ]
      pattern: "*.{fastq.gz}"
  - ch_reference:
      type: file
      description: | 
        Sequence database for read orientation

output:
  - consensus:
      description: |
        Consensus sequences for clusters of reads
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.fasta"
  - multiqc_files:
      type: file
      description: |
        multiqc files for statistics
        Structure: [ val(meta), path(*) ]
      pattern: "*"
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@snunzi"
maintainers:
  - "@snunzi"

# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# # TODO nf-core: Add a description of the module and list keywords
name: "bbmap_reformat"
description: write your description here
keywords:
  - sort
  - example
  - genomics
tools:
  ## TODO nf-core: Add a description and other details for the software below
  - "bbmap":
      description: "BBMap is a short read aligner, as well as various other bioinformatic
        tools."
      homepage: "https://jgi.doe.gov/data-and-tools/bbtools/bb-tools-user-guide"
      documentation: "https://jgi.doe.gov/data-and-tools/bbtools/bb-tools-user-guide"
      tool_dev_url: "https://sourceforge.net/projects/bbmap"
      doi: ""
      licence: ["UC-LBL license (see package)"]
      identifier: biotools:bbmap

input:
  ### TODO nf-core: Add a description of all of the variables used as input
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - bam:
        type: file
        description: Sorted BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies:
          - edam: "http://edamontology.org/format_2572" # BAM
          - edam: "http://edamontology.org/format_2573" # CRAM
          - edam: "http://edamontology.org/format_3462" # SAM

output:
  ### TODO nf-core: Add a description of all of the variables used as output
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.bam":
          type: file
          description: Sorted BAM/CRAM/SAM file
          pattern: "*.{bam,cram,sam}"
          ontologies:
            - edam: "http://edamontology.org/format_2572" # BAM
            - edam: "http://edamontology.org/format_2573" # CRAM
            - edam: "http://edamontology.org/format_3462" # SAM
  versions_bbmap:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "bbmap":
          type: string
          description: The name of the tool
      - "bbmap --version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bbmap:
          type: string
          description: The name of the tool
      - bbmap --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@snunzi"
maintainers:
  - "@snunzi"
